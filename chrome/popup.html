<!doctype html>
<html>
  <head>
    <title>Tahir</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        overflow: hidden;
      }

      :root {
        --bg: #f8f8f3;
        --bg-row: #ededea;
        --border: #bebeb4;
        --green: #166500;
        --green-bg: #dff0d8;
        --amber: #7a4d00;
        --amber-bg: #fef3cd;
        --red: #a81010;
        --text: #111111;
        --label: #222222;
        --muted: #777777;
        --font: "SF Mono", "Fira Code", "Cascadia Code", "Consolas", monospace;
      }

      html[data-theme="dark"] {
        --bg: #111;
        --bg-row: #1a1a1a;
        --border: #2e2e2e;
        --green: #3ddc18;
        --green-bg: #0d2208;
        --amber: #e6a817;
        --amber-bg: #1f1500;
        --red: #e84040;
        --text: #e0e0e0;
        --label: #b0b0b0;
        --muted: #505050;
      }

      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        width: 300px;
        font-size: 12px;
        line-height: 1.4;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ─── Header ─── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }

      .logo-name {
        color: var(--green);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .logo-ver {
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1px;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* Theme toggle */
      .btn-theme {
        font-family: var(--font);
        font-size: 10px;
        padding: 2px 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        letter-spacing: 0.5px;
        transition:
          color 0.1s,
          border-color 0.1s;
      }

      .btn-theme:hover {
        color: var(--text);
        border-color: var(--text);
      }

      /* Power toggle */
      .power-toggle {
        cursor: pointer;
        user-select: none;
      }
      .power-toggle input {
        display: none;
      }

      .power-label {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        padding: 2px 8px;
        border: 1px solid var(--muted);
        color: var(--muted);
        transition:
          color 0.15s,
          border-color 0.15s,
          background 0.15s;
      }

      .power-toggle input:checked ~ .power-label {
        color: var(--green);
        border-color: var(--green);
        background: var(--green-bg);
      }

      /* ─── Body ─── */
      .body {
        padding: 10px 0 6px;
      }

      /* ─── Group ─── */
      .group {
        margin-bottom: 8px;
      }

      .group-title {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 0 14px 4px;
        margin-bottom: 2px;
      }

      /* ─── Row ─── */
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 14px;
        gap: 8px;
      }

      .row-label {
        font-size: 12px;
        color: var(--label);
        flex: 1;
      }

      /* ─── Toggle ─── */
      .toggle {
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
      }
      .toggle input {
        display: none;
      }

      .toggle-box {
        font-size: 11px;
        font-family: var(--font);
        color: var(--muted);
        padding: 1px 5px;
        border: 1px solid var(--border);
        transition:
          color 0.12s,
          border-color 0.12s;
        white-space: nowrap;
      }

      .toggle input:checked ~ .toggle-box {
        color: var(--green);
        border-color: var(--green);
      }

      /* ─── Slider ─── */
      .slider-group {
        padding: 4px 14px 6px;
      }

      .slider-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 5px;
      }

      .slider-label {
        font-size: 11px;
        color: var(--muted);
        padding-left: 10px;
      }

      .slider-val {
        font-size: 11px;
        color: var(--green);
        font-weight: 700;
      }

      input[type="range"] {
        width: 100%;
        height: 3px;
        -webkit-appearance: none;
        appearance: none;
        background: var(--border);
        outline: none;
        cursor: pointer;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 11px;
        height: 11px;
        background: var(--green);
        border-radius: 0;
        cursor: pointer;
      }

      /* ─── Apply-to chips ─── */
      .chips {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
      }

      .chip {
        cursor: pointer;
        user-select: none;
      }
      .chip input {
        display: none;
      }

      .chip-inner {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 14px;
        font-size: 12px;
        color: var(--label);
        transition: background 0.1s;
      }

      .chip:hover .chip-inner {
        background: var(--bg-row);
      }

      .chip-box {
        font-size: 11px;
        font-family: var(--font);
        color: var(--muted);
        flex-shrink: 0;
        width: 16px;
      }

      .chip input:checked ~ .chip-inner {
        color: var(--text);
      }
      .chip input:checked ~ .chip-inner .chip-box {
        color: var(--green);
      }

      /* ─── Whitelist ─── */
      .whitelist-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 14px;
      }

      .domain {
        flex: 1;
        font-size: 11px;
        color: var(--label);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ─── Buttons ─── */
      .btn {
        font-family: var(--font);
        font-size: 10px;
        padding: 2px 8px;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
        text-decoration: none;
        white-space: nowrap;
        letter-spacing: 0.5px;
        transition:
          background 0.12s,
          color 0.12s;
        flex-shrink: 0;
      }

      .btn-green {
        color: var(--green);
      }
      .btn-green:hover {
        background: var(--green);
        color: var(--bg);
      }
      .btn-red {
        color: var(--red);
      }
      .btn-red:hover {
        background: var(--red);
        color: var(--bg);
      }
      .btn-amber {
        color: var(--amber);
        border-color: var(--amber);
      }
      .btn-amber:hover {
        background: var(--amber);
        color: var(--bg);
      }

      /* ─── Pause row ─── */
      .pause-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 14px;
        background: var(--amber-bg);
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        margin-bottom: 6px;
      }

      .pause-info {
        font-size: 11px;
        color: var(--amber);
      }

      .pause-countdown {
        font-weight: 700;
        margin: 0 4px;
      }

      /* ─── Shortcuts ─── */
      .shortcuts {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 3px 6px;
        padding: 4px 14px;
        align-items: baseline;
      }

      .kbd {
        font-size: 10px;
        color: var(--green);
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .shortcut-desc {
        font-size: 11px;
        color: var(--muted);
      }

      /* ─── Footer (update) ─── */
      .footer {
        display: none;
        padding: 5px 14px;
        border-top: 1px solid var(--border);
        font-size: 10px;
        color: var(--muted);
        background: var(--green-bg);
      }

      .btn-link {
        background: none;
        border: none;
        font-family: var(--font);
        font-size: 10px;
        cursor: pointer;
        padding: 0;
      }

      /* ─── Divider ─── */
      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="logo">
        <span class="logo-name">Tahir</span>
        <span class="logo-ver">v2.0</span>
      </div>
      <div class="header-controls">
        <button class="btn-theme" id="btn-theme">[ dark ]</button>
        <label class="power-toggle">
          <input type="checkbox" id="status" name="status" />
          <span class="power-label">OFF</span>
        </label>
      </div>
    </div>

    <div class="body">
      <!-- Pause: active state -->
      <div
        id="pause-active-row"
        class="row"
        style="padding-top: 6px; padding-bottom: 6px"
      >
        <span class="row-label" style="color: var(--muted); font-size: 11px"
          >Blur is active</span
        >
        <button class="btn btn-amber" id="btn-pause">pause 5 min</button>
      </div>

      <!-- Pause: paused state -->
      <div id="pause-paused-row" class="pause-row" style="display: none">
        <span class="pause-info">
          Paused &mdash; resumes in
          <span class="pause-countdown" id="pause-countdown">5:00</span>
        </span>
        <button class="btn btn-green" id="btn-resume">resume</button>
      </div>

      <div class="divider"></div>

      <!-- Filter -->
      <div class="group">
        <div class="group-title">// Filter</div>

        <div class="row">
          <span class="row-label">Enable blur</span>
          <label class="toggle">
            <input type="checkbox" name="blurEnabled" />
            <span class="toggle-box">blur</span>
          </label>
        </div>

        <div class="slider-group">
          <div class="slider-meta">
            <span class="slider-label">Blur intensity</span>
            <span class="slider-val" name="bluramttext">20px</span>
          </div>
          <input type="range" min="1" max="50" name="bluramt" />
        </div>

        <div class="row">
          <span class="row-label">Grayscale</span>
          <label class="toggle">
            <input type="checkbox" name="grayscale" />
            <span class="toggle-box">gray</span>
          </label>
        </div>

        <div class="slider-group">
          <div class="slider-meta">
            <span class="slider-label">Darken</span>
            <span class="slider-val" name="darkenamttext">0%</span>
          </div>
          <input type="range" min="0" max="100" name="darkenamt" />
        </div>
      </div>

      <div class="divider"></div>

      <!-- Apply To -->
      <div class="group">
        <div class="group-title">// Apply To</div>
        <div class="chips">
          <label class="chip">
            <input type="checkbox" id="chk-images" name="images" />
            <div class="chip-inner">
              <span class="chip-box">[x]</span>Images
            </div>
          </label>
          <label class="chip">
            <input type="checkbox" id="chk-bg" name="bgimages" />
            <div class="chip-inner">
              <span class="chip-box">[x]</span>BG Images
            </div>
          </label>
          <label class="chip">
            <input type="checkbox" id="chk-videos" name="videos" />
            <div class="chip-inner">
              <span class="chip-box">[x]</span>Videos
            </div>
          </label>
          <label class="chip">
            <input type="checkbox" id="chk-iframes" name="iframes" />
            <div class="chip-inner">
              <span class="chip-box">[x]</span>Iframes
            </div>
          </label>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Whitelist -->
      <div class="group">
        <div class="group-title">// Whitelist</div>
        <div class="whitelist-row">
          <span class="domain" id="current-domain"></span>
          <a
            href="#"
            id="btn-whitelist-add"
            class="btn btn-green"
            style="display: none"
            >+ add</a
          >
          <a
            href="#"
            id="btn-whitelist-remove"
            class="btn btn-red"
            style="display: none"
            >remove</a
          >
        </div>
      </div>

      <div class="divider"></div>

      <!-- Shortcuts -->
      <div class="group">
        <div class="group-title">// Shortcuts</div>
        <div class="shortcuts">
          <span class="kbd">alt+l</span
          ><span class="shortcut-desc">Toggle on / off</span>
          <span class="kbd">alt+k</span
          ><span class="shortcut-desc">Unblur hovered image</span>
          <span class="kbd">alt+p</span
          ><span class="shortcut-desc">Pause for 5 minutes</span>
        </div>
      </div>
    </div>

    <!-- Update footer -->
    <div class="footer" id="update">
      &gt;
      <button
        class="btn-link"
        name="readmore"
        style="color: var(--green); text-decoration: underline"
      >
        Tahir V2.0 - What's New
      </button>
      <button
        class="btn-link"
        name="dismiss"
        style="margin-left: 10px; color: var(--muted)"
      >
        dismiss
      </button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
