<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tahir</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --panel: #ffffff;
        --panel-strong: #ffffff;
        --text: #1c1c1e;
        --subtext: #6e6e73;
        --muted: #8e8e93;
        --line: rgba(60, 60, 67, 0.14);
        --accent: #34c759;
        --accent-strong: #248a3d;
        --blue: #007aff;
        --warning: #ff9f0a;
        --danger: #ff3b30;
        --shadow: none;
      }

      :root[data-theme="dark"] {
        --bg: #000000;
        --panel: #1c1c1e;
        --panel-strong: #2c2c2e;
        --text: #f5f5f7;
        --subtext: #aeaeb2;
        --muted: #8e8e93;
        --line: rgba(84, 84, 88, 0.55);
        --accent: #30d158;
        --accent-strong: #32d74b;
        --blue: #0a84ff;
        --warning: #ffd60a;
        --danger: #ff453a;
        --shadow: none;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 324px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.34 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      .app {
        padding: 11px;
      }

      .card {
        overflow: hidden;
        margin-bottom: 9px;
        border-radius: 13px;
        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .status-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
      }

      .status-title {
        font-size: 14px;
        font-weight: 650;
      }

      .status-text {
        margin-top: 2px;
        color: var(--subtext);
        font-size: 11px;
      }

      .countdown {
        display: inline-flex;
        min-width: 42px;
        justify-content: center;
        margin-top: 7px;
        padding: 3px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--warning) 18%, transparent);
        color: var(--warning);
        font-size: 11px;
        font-weight: 650;
      }

      .primary-button {
        min-width: 70px;
        height: 33px;
        padding: 0 13px;
        border-radius: 999px;
        background: var(--blue);
        color: #ffffff;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      .primary-button.resume {
        background: var(--accent);
      }

      .section-title {
        margin: 13px 4px 5px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 650;
        text-transform: uppercase;
      }

      .row {
        display: flex;
        min-height: 41px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
      }

      .row + .row {
        border-top: 1px solid var(--line);
      }

      .label {
        min-width: 0;
      }

      .label strong {
        display: block;
        font-size: 13px;
        font-weight: 500;
      }

      .label span {
        display: block;
        margin-top: 2px;
        color: var(--subtext);
        font-size: 11px;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 26px;
        flex: 0 0 auto;
      }

      .switch input {
        display: none;
      }

      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: #d8d8de;
        transition: background 0.16s ease;
      }

      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.2),
          0 1px 5px rgba(0, 0, 0, 0.12);
        transition: transform 0.16s ease;
      }

      .switch input:checked + span {
        background: var(--accent);
      }

      .switch input:checked + span::after {
        transform: translateX(16px);
      }

      .slider-row {
        padding: 8px 12px 12px;
      }

      .slider-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .slider-head strong {
        font-size: 13px;
        font-weight: 500;
      }

      .value {
        color: var(--blue);
        font-size: 12px;
        font-weight: 650;
      }

      input[type="range"] {
        width: 100%;
        height: 4px;
        margin: 0;
        appearance: none;
        border-radius: 999px;
        background: var(--line);
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 21px;
        height: 21px;
        appearance: none;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 5px rgba(0, 0, 0, 0.22),
          inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        cursor: pointer;
      }

      .media-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .media-grid .row:nth-child(2n) {
        border-left: 1px solid var(--line);
      }

      .media-grid .row:nth-child(-n + 2) {
        border-top: 0;
      }

      .domain-row {
        align-items: center;
      }

      .domain-name {
        overflow: hidden;
        max-width: 166px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .domain-button {
        height: 31px;
        min-width: 66px;
        padding: 0 12px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--blue) 14%, transparent);
        color: var(--blue);
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
      }

      .domain-button:disabled {
        color: var(--muted);
        cursor: default;
      }

      .shortcut {
        min-height: 36px;
        color: var(--subtext);
        font-size: 11px;
      }

      .shortcut b {
        color: var(--text);
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 3px 4px 0;
        color: var(--muted);
      }

      .footer a {
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
      }

      .theme-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      .theme-control input {
        display: none;
      }

      .mini-switch {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: #d8d8de;
        transition: background 0.16s ease;
      }

      .mini-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.2),
          0 1px 4px rgba(0, 0, 0, 0.12);
        transition: transform 0.16s ease;
      }

      .theme-control input:checked + .mini-switch {
        background: var(--accent);
      }

      .theme-control input:checked + .mini-switch::after {
        transform: translateX(14px);
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="card status-card">
        <div>
          <div class="status-title" id="statusTitle">Protecting</div>
          <div class="status-text" id="statusText">Active on protected sites.</div>
          <div class="countdown" id="countdown" hidden></div>
        </div>
        <button class="primary-button" id="pauseButton" type="button">Pause</button>
        <button class="primary-button resume" id="resumeButton" type="button" hidden>
          Resume
        </button>
      </section>

      <div class="section-title">Filter</div>
      <section class="card">
        <div class="row">
          <div class="label">
            <strong>Blur</strong>
          </div>
          <label class="switch">
            <input id="blurEnabled" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="slider-row">
          <div class="slider-head">
            <strong>Intensity</strong>
            <span class="value" id="blurValue">20px</span>
          </div>
          <input id="blurAmt" type="range" min="1" max="50" />
        </div>
        <div class="row">
          <div class="label">
            <strong>Grayscale</strong>
          </div>
          <label class="switch">
            <input id="grayscale" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="slider-row">
          <div class="slider-head">
            <strong>Darken</strong>
            <span class="value" id="darkenValue">0%</span>
          </div>
          <input id="darkenAmt" type="range" min="0" max="100" />
        </div>
      </section>

      <div class="section-title">Media</div>
      <section class="card media-grid">
        <div class="row">
          <div class="label"><strong>Images</strong></div>
          <label class="switch">
            <input id="images" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="row">
          <div class="label"><strong>Videos</strong></div>
          <label class="switch">
            <input id="videos" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="row">
          <div class="label"><strong>Iframes</strong></div>
          <label class="switch">
            <input id="iframes" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="row">
          <div class="label"><strong>Backgrounds</strong></div>
          <label class="switch">
            <input id="bgImages" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <div class="section-title">Strict Mode</div>
      <section class="card">
        <div class="row">
          <div class="label">
            <strong>Hide videos</strong>
          </div>
          <label class="switch">
            <input id="hideVideos" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <div class="section-title">Current Site</div>
      <section class="card">
        <div class="row domain-row">
          <div class="label">
            <strong class="domain-name" id="domainName">Loading</strong>
            <span id="domainStatus">Protected site</span>
          </div>
          <button class="domain-button" id="domainButton" type="button">Allow</button>
        </div>
      </section>

      <div class="section-title">Shortcuts</div>
      <section class="card">
        <div class="row shortcut"><span><b>Alt+P</b> Pause 5 minutes</span></div>
        <div class="row shortcut"><span><b>Alt+W</b> Toggle site access</span></div>
      </section>

      <footer class="footer">
        <a id="githubLink" href="https://github.com/zackha/tahir">GitHub</a>
        <label class="theme-control">
          <span>Dark Mode</span>
          <input id="themeButton" type="checkbox" />
          <span class="mini-switch"></span>
        </label>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
