<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CleanWeb</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --group: #ffffff;
        --text: #1d1d1f;
        --secondary: #6e6e73;
        --tertiary: #9a9aa0;
        --separator: rgba(60, 60, 67, 0.1);
        --blue: #007aff;
        --green: #34c759;
        --orange: #ff9500;
        --switch-off: #d8d8de;
        --control-fill: rgba(118, 118, 128, 0.12);
      }

      :root[data-theme="dark"] {
        --bg: #000000;
        --group: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #aeaeb2;
        --tertiary: #7c7c80;
        --separator: rgba(84, 84, 88, 0.38);
        --blue: #0a84ff;
        --green: #30d158;
        --orange: #ff9f0a;
        --switch-off: #39393d;
        --control-fill: rgba(118, 118, 128, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 326px;
        height: 560px;
        margin: 0;
        overflow: auto;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.32 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", sans-serif;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      .app {
        position: relative;
        min-height: 100%;
        overflow: hidden;
        padding: 10px 10px 11px;
      }

      :root[data-paused="true"],
      :root[data-paused="true"] body {
        overflow: hidden;
      }

      .status-title {
        font-size: 13px;
        font-weight: 500;
        line-height: 1.2;
      }

      .status-text {
        margin-top: 2px;
        color: var(--secondary);
        font-size: 11px;
      }

      .section-title {
        margin: 14px 16px 6px;
        color: var(--tertiary);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.25px;
        text-transform: uppercase;
      }

      .group {
        overflow: hidden;
        border-radius: 13px;
        background: var(--group);
      }

      .row {
        position: relative;
        display: flex;
        min-height: 43px;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 12px 9px 16px;
      }

      .row + .row::before,
      .slider-row + .row::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        left: 16px;
        height: 1px;
        background: var(--separator);
      }

      .label {
        min-width: 0;
      }

      .label strong,
      .slider-head strong {
        display: block;
        color: var(--text);
        font-size: 13.5px;
        font-weight: 510;
        line-height: 1.2;
      }

      .label span {
        display: block;
        margin-top: 2px;
        color: var(--secondary);
        font-size: 11px;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 41px;
        height: 25px;
        flex: 0 0 auto;
        cursor: pointer;
      }

      .switch input {
        display: none;
      }

      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--switch-off);
        transition: background 0.18s ease;
      }

      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.2),
          0 1px 5px rgba(0, 0, 0, 0.12);
        transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .switch input:checked + span {
        background: var(--green);
      }

      .switch input:checked + span::after {
        transform: translateX(16px);
      }

      .slider-row {
        padding: 9px 12px 13px 16px;
      }

      .slider-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .value {
        color: var(--blue);
        font-size: 12px;
        font-weight: 650;
      }

      input[type="range"] {
        width: 100%;
        height: 4px;
        margin: 0;
        appearance: none;
        border-radius: 999px;
        background: var(--control-fill);
        outline: none;
      }

      input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;
      }

      input[type="range"]::-webkit-slider-thumb {
        width: 22px;
        height: 22px;
        appearance: none;
        margin-top: -9px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 5px rgba(0, 0, 0, 0.22),
          inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        cursor: pointer;
      }

      .domain-name {
        overflow: hidden;
        max-width: 184px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .shortcut {
        min-height: 36px;
        color: var(--secondary);
        font-size: 11px;
      }

      .shortcut b {
        color: var(--text);
        font-weight: 650;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 6px 0;
        color: var(--tertiary);
      }

      .footer a {
        color: var(--blue);
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
      }

      .theme-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--secondary);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }

      .theme-control input {
        display: none;
      }

      .mini-switch {
        position: relative;
        width: 34px;
        height: 20px;
        border-radius: 999px;
        background: var(--switch-off);
        transition: background 0.18s ease;
      }

      .mini-switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.2),
          0 1px 4px rgba(0, 0, 0, 0.12);
        transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .theme-control input:checked + .mini-switch {
        background: var(--green);
      }

      .theme-control input:checked + .mini-switch::after {
        transform: translateX(14px);
      }

      .timer-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(5px) saturate(180%);
        -webkit-backdrop-filter: blur(5px) saturate(180%);
      }

      .timer-card {
        display: flex;
        width: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .timer-label {
        color: var(--secondary);
        font-size: 12px;
        font-weight: 510;
      }

      .timer-count {
        margin-top: 12px;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        font-size: 58px;
        font-weight: 200;
        line-height: 1;
        letter-spacing: -1px;
      }

      .timer-subtitle {
        margin-top: 9px;
        color: var(--tertiary);
        font-size: 12px;
      }

      .timer-button {
        height: 44px;
        margin-top: 28px;
        padding: 0 22px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--orange) 18%, transparent);
        color: var(--orange);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="group">
        <div class="row">
          <div class="label">
            <strong id="statusTitle">Protection</strong>
            <span id="statusText">Active on protected sites.</span>
          </div>
          <label class="switch">
            <input id="protectionSwitch" type="checkbox" checked />
            <span></span>
          </label>
        </div>
      </section>

      <div class="section-title">Filter</div>
      <section class="group">
        <div class="row">
          <div class="label">
            <strong>Blur</strong>
          </div>
          <label class="switch">
            <input id="blurEnabled" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="slider-row">
          <div class="slider-head">
            <strong>Intensity</strong>
            <span class="value" id="blurValue">20px</span>
          </div>
          <input id="blurAmt" type="range" min="1" max="50" />
        </div>
        <div class="row">
          <div class="label">
            <strong>Grayscale</strong>
          </div>
          <label class="switch">
            <input id="grayscale" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="slider-row">
          <div class="slider-head">
            <strong>Darken</strong>
            <span class="value" id="darkenValue">0%</span>
          </div>
          <input id="darkenAmt" type="range" min="0" max="100" />
        </div>
      </section>

      <div class="section-title">Media</div>
      <section class="group">
        <div class="row">
          <div class="label"><strong>Images</strong></div>
          <label class="switch">
            <input id="images" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="row">
          <div class="label"><strong>Videos</strong></div>
          <label class="switch">
            <input id="videos" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="row">
          <div class="label"><strong>Iframes</strong></div>
          <label class="switch">
            <input id="iframes" type="checkbox" />
            <span></span>
          </label>
        </div>
        <div class="row">
          <div class="label"><strong>Backgrounds</strong></div>
          <label class="switch">
            <input id="bgImages" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <div class="section-title">Strict Mode</div>
      <section class="group">
        <div class="row">
          <div class="label">
            <strong>Hide videos</strong>
          </div>
          <label class="switch">
            <input id="hideVideos" type="checkbox" />
            <span></span>
          </label>
        </div>
      </section>

      <div class="section-title">Current Site</div>
      <section class="group">
        <div class="row">
          <div class="label">
            <strong class="domain-name" id="domainName">Loading</strong>
            <span id="domainStatus">Protected site</span>
          </div>
          <label class="switch">
            <input id="domainSwitch" type="checkbox" checked />
            <span></span>
          </label>
        </div>
      </section>

      <div class="section-title">Shortcuts</div>
      <section class="group">
        <div class="row shortcut"><span><b>Alt+P</b> Pause 60 seconds</span></div>
        <div class="row shortcut"><span><b>Alt+W</b> Toggle site access</span></div>
      </section>

      <footer class="footer">
        <a id="githubLink" href="https://github.com/zackha/tahir">GitHub</a>
        <label class="theme-control">
          <span>Dark Mode</span>
          <input id="themeButton" type="checkbox" />
          <span class="mini-switch"></span>
        </label>
      </footer>

      <section class="timer-overlay" id="timerOverlay" hidden>
        <div class="timer-card">
          <div class="timer-label">Protection Paused</div>
          <div class="timer-count" id="timerCountdown">1:00</div>
          <div class="timer-subtitle">Resumes automatically</div>
          <button class="timer-button" id="timerResumeButton" type="button">
            Resume Protection
          </button>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
