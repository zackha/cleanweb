<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Allowed Sites — CleanWeb</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f2f2f7;
        --group: #ffffff;
        --text: #1d1d1f;
        --secondary: #6e6e73;
        --tertiary: #9a9aa0;
        --separator: rgba(60, 60, 67, 0.1);
        --blue: #007aff;
        --red: #ff3b30;
        --control-fill: rgba(118, 118, 128, 0.12);
        --card-shadow: 0 1px 0 rgba(0, 0, 0, 0.06), 0 2px 12px rgba(0, 0, 0, 0.04);
      }

      :root[data-theme="dark"] {
        --bg: #000000;
        --group: #1c1c1e;
        --text: #f5f5f7;
        --secondary: #aeaeb2;
        --tertiary: #7c7c80;
        --separator: rgba(84, 84, 88, 0.38);
        --blue: #0a84ff;
        --red: #ff453a;
        --control-fill: rgba(118, 118, 128, 0.24);
        --card-shadow: none;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.4 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 620px;
        margin: 0 auto;
        padding: 0 16px 60px;
      }

      /* ── Nav ── */
      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        padding: 16px 0 0;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        transition: box-shadow 0.2s ease;
      }

      .nav[data-scrolled] {
        box-shadow: 0 1px 0 var(--separator);
      }

      .nav-inner {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 10px;
      }

      .nav-title {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.6px;
      }

      .nav-count {
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 9px;
        border-radius: 999px;
        background: var(--control-fill);
        color: var(--secondary);
        font-size: 12px;
        font-weight: 600;
      }

      .nav-count:empty {
        display: none;
      }

      /* ── Search ── */
      .search-wrap {
        padding: 10px 0 8px;
      }

      .search-bar {
        display: flex;
        align-items: center;
        gap: 7px;
        height: 36px;
        padding: 0 10px;
        border-radius: 10px;
        background: var(--control-fill);
      }

      .search-bar svg {
        flex: 0 0 auto;
        color: var(--tertiary);
      }

      .search-input {
        flex: 1;
        border: 0;
        background: transparent;
        color: var(--text);
        font:
          15px -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          sans-serif;
        outline: none;
      }

      .search-input::placeholder {
        color: var(--tertiary);
      }

      .search-input::-webkit-search-decoration,
      .search-input::-webkit-search-cancel-button,
      .search-input::-webkit-search-results-button,
      .search-input::-webkit-search-results-decoration {
        -webkit-appearance: none;
        display: none;
      }

      .search-clear {
        display: none;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 50%;
        background: var(--tertiary);
        color: var(--bg);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .search-clear.visible {
        display: flex;
      }

      .search-clear:hover {
        background: var(--secondary);
      }

      /* ── Sections ── */
      .section-title {
        margin: 22px 16px 6px;
        color: var(--tertiary);
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }

      /* ── Group card ── */
      .group {
        overflow: hidden;
        border-radius: 13px;
        background: var(--group);
        box-shadow: var(--card-shadow);
      }

      /* ── Add row ── */
      .add-row {
        display: flex;
        align-items: center;
        height: 44px;
      }

      .add-input {
        flex: 1;
        height: 100%;
        padding: 0 12px 0 16px;
        border: 0;
        background: transparent;
        color: var(--text);
        font:
          15px -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          sans-serif;
        outline: none;
      }

      .add-input::placeholder {
        color: var(--tertiary);
      }

      .add-btn {
        flex: 0 0 auto;
        height: 100%;
        padding: 0 16px;
        border: 0;
        border-left: 1px solid var(--separator);
        background: transparent;
        color: var(--blue);
        font:
          600 15px -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          sans-serif;
        border-radius: 0 13px 13px 0;
        cursor: pointer;
        transition: background 0.15s ease;
      }

      .add-btn:hover:not(:disabled) {
        background: color-mix(in srgb, var(--blue) 8%, transparent);
      }

      .add-btn:active:not(:disabled) {
        background: color-mix(in srgb, var(--blue) 14%, transparent);
      }

      .add-btn:disabled {
        color: var(--tertiary);
        cursor: default;
      }

      /* ── Error ── */
      .error-msg {
        margin-top: 6px;
        padding: 0 16px;
        color: var(--red);
        font-size: 12px;
        min-height: 16px;
      }

      /* ── Domain rows ── */
      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .domain-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 10px 12px 10px 16px;
        animation: rowIn 0.18s ease both;
        transition: background 0.12s ease;
      }

      .domain-row:hover {
        background: color-mix(in srgb, var(--text) 3%, transparent);
      }

      .domain-row + .domain-row::before {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        left: 16px;
        height: 1px;
        background: var(--separator);
      }

      .domain-text {
        font-size: 15px;
        color: var(--text);
        word-break: break-all;
      }

      /* ── Remove button ── */
      .remove-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        border: 0;
        border-radius: 50%;
        background: color-mix(in srgb, var(--red) 12%, var(--control-fill));
        color: var(--red);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        transition:
          background 0.15s ease,
          color 0.15s ease,
          transform 0.1s ease;
      }

      .remove-btn:hover {
        background: var(--red);
        color: #ffffff;
        transform: scale(1.1);
      }

      .remove-btn:active {
        transform: scale(0.92);
      }

      /* ── Empty state ── */
      .empty {
        padding: 40px 16px;
        text-align: center;
      }

      .empty-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 14px;
        border-radius: 16px;
        background: color-mix(in srgb, var(--blue) 10%, transparent);
        color: var(--blue);
      }

      .empty-title {
        color: var(--text);
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 5px;
      }

      .empty-body {
        color: var(--secondary);
        font-size: 13px;
        line-height: 1.5;
      }

      /* ── No results ── */
      .no-results {
        padding: 28px 16px;
        text-align: center;
        color: var(--secondary);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <nav class="nav" id="nav">
        <div class="nav-inner">
          <span class="nav-title">Allowed Sites</span>
          <span class="nav-count" id="navCount"></span>
        </div>
        <div class="search-wrap">
          <div class="search-bar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M10 2a8 8 0 1 1 0 16A8 8 0 0 1 10 2Zm0 2a6 6 0 1 0 0 12A6 6 0 0 0 10 4Zm8.293 11.293 3.414 3.414-1.414 1.414-3.414-3.414 1.414-1.414Z" />
            </svg>
            <input
              class="search-input"
              id="searchInput"
              type="search"
              placeholder="Search"
              autocomplete="off"
            />
            <button class="search-clear" id="searchClear" aria-label="Clear">×</button>
          </div>
        </div>
      </nav>

      <div class="section-title">Add Domain</div>
      <div class="group">
        <div class="add-row">
          <input
            class="add-input"
            id="addInput"
            type="text"
            placeholder="example.com"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          />
          <button class="add-btn" id="addBtn" disabled>Add</button>
        </div>
      </div>
      <div class="error-msg" id="errorMsg"></div>

      <div class="section-title" id="listTitle">Domains</div>
      <div class="group" id="listGroup"></div>
    </div>

    <script src="whitelist.js"></script>
  </body>
</html>
